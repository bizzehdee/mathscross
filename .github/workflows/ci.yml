name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The fast suite only. The slow suite runs in slow.yml, nightly and on
      # tags: a MathsCross generation attempt costs more than a Sudoku one, so
      # running 100 seeds per difficulty here would tax every push for a signal
      # that changes rarely. Plan section 10.4.
      - name: Unit tests
        run: npm test

      # The installed launcher icon, the web icons and the store icon are all
      # drawn by this one script, and all three are committed. Regenerating and
      # diffing is what stops the committed files drifting from the drawing —
      # a store icon that no longer matches the installed one is a Play
      # rejection, and nothing else in the build looks at these files.
      - name: Icons are up to date
        run: |
          npm run icons
          npm run store:assets
          git diff --exit-code -- public/icons public/icon.svg store native/res \
            || { echo "Committed icons differ from the generator. Run 'npm run icons && npm run store:assets' and commit the result." >&2; exit 1; }

      - name: Build
        run: npm run build

      # Added at M3, once there was a bundle worth measuring. Ceilings live in
      # scripts/check-size.mjs and are set from measurement. Plan section 8.4.
      - name: Bundle size
        run: npm run size

      # The native bundle is built from the same source through a second Vite
      # config, so a change can break it while leaving the web build passing.
      # This is seconds, and it is the only thing here that would catch it.
      - name: Build native bundle
        run: npm run build:native
